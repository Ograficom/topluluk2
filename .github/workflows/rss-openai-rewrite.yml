name: RSS OpenAI Rewrite

on:
  push:
    branches:
      - main
    paths:
      - 'app/Providers/AppServiceProvider.php'
      - 'app/Services/Rss/OpenAiRssArticleRewriteService.php'
      - 'database/migrations/*rss*'
      - '.github/workflows/rss-openai-rewrite.yml'
  workflow_dispatch:

concurrency:
  group: ografi-rss-openai-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Configure OpenAI and rewrite one live RSS post
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: 2.24.139.184
          username: root
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: 22
          timeout: 120s
          command_timeout: 10m
          script: |
            set -e
            TARGET_PATH="${{ secrets.SERVER_PATH }}"
            if [ -z "$TARGET_PATH" ]; then
              TARGET_PATH="/www/wwwroot/ografi_com_app"
            fi
            cd "$TARGET_PATH"

            git fetch origin main
            git reset --hard origin/main

            OPENAI_API_KEY_VALUE="${{ secrets.OPENAI_API_KEY }}"
            if [ -z "$OPENAI_API_KEY_VALUE" ]; then
              echo 'OPENAI_API_KEY GitHub secret is missing. RSS rewriting is OpenAI-only and cannot run.' >&2
              exit 1
            fi

            set_env_value() {
              KEY="$1"
              VALUE="$2"
              if grep -q "^${KEY}=" .env; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env
              else
                printf '\n%s=%s\n' "$KEY" "$VALUE" >> .env
              fi
            }

            set_env_value OPENAI_API_KEY "$OPENAI_API_KEY_VALUE"
            set_env_value OPENAI_MODEL 'gpt-5.6-terra'
            set_env_value OPENAI_POST_EDITOR_MODEL 'gpt-5.6-terra'

            php artisan optimize:clear
            php artisan migrate --force
            php artisan optimize:clear

            php artisan tinker --execute="echo 'RSS AI service=' . get_class(app(\\App\\Services\\Rss\\RssArticleRewriteService::class)) . PHP_EOL;"

            if ! php artisan tinker --execute="exit(get_class(app(\\App\\Services\\Rss\\RssArticleRewriteService::class)) === 'App\\Services\\Rss\\OpenAiRssArticleRewriteService' ? 0 : 1);"; then
              echo 'RSS rewrite service is not OpenAI-backed.' >&2
              exit 1
            fi

            php artisan rss:ai-rewrite-linked --limit=1

            php artisan tinker --execute="
              \\$item = \\App\\Models\\RssItem::query()->whereNotNull('post_id')->whereNotNull('ai_rewritten_at')->latest('ai_rewritten_at')->first();
              if (! \\$item) { fwrite(STDERR, 'No linked RSS item was rewritten by OpenAI.' . PHP_EOL); exit(1); }
              \\$post = \\$item->post()->first();
              if (! \\$post || trim((string) \\$post->content) !== trim((string) \\$item->ai_content)) { fwrite(STDERR, 'OpenAI rewrite was not synchronized to the published post.' . PHP_EOL); exit(1); }
              echo 'OpenAI RSS rewrite verified: rss_item_id=' . \\$item->id . ' post_id=' . \\$item->post_id . PHP_EOL;
            "

            php artisan config:cache || true
            /etc/init.d/php-fpm-84 restart || true
