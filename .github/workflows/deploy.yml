name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: ografi-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: 2.24.139.184
          username: root
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: 22
          timeout: 120s
          command_timeout: 20m
          script: |
            set -e
            TARGET_PATH="${{ secrets.SERVER_PATH }}"
            if [ -z "$TARGET_PATH" ]; then
              TARGET_PATH="/www/wwwroot/ografi_com_app"
            fi
            cd "$TARGET_PATH"

            # A crashed/overlapping deploy can leave this behind and block every
            # following git operation. GitHub Actions deploys are serialized above,
            # so removing a stale lock here is safe for this deployment path.
            rm -f .git/index.lock

            git stash --include-untracked || true
            git fetch origin main
            git reset --hard origin/main
            php artisan optimize:clear || true

            set_env_value() {
              KEY="$1"
              VALUE="$2"
              if grep -q "^${KEY}=" .env; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env
              else
                printf '\n%s=%s\n' "$KEY" "$VALUE" >> .env
              fi
            }

            # Never serve debug bundles or exception details in production.
            set_env_value APP_ENV production
            set_env_value APP_DEBUG false

            COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan livewire:publish --assets --no-interaction

            # Always rebuild Node dependencies from package-lock.json. This prevents
            # stale server node_modules (for example Tailwind 4) from being mixed
            # with this repository's Tailwind 3/PostCSS configuration.
            if [ ! -f package-lock.json ]; then
              echo "package-lock.json is required for deterministic production builds" >&2
              exit 1
            fi
            rm -rf node_modules
            npm ci --include=dev --no-audit --no-fund
            npm run build

            OGRAFI_NGINX_CONFIG=/www/server/panel/vhost/nginx/ografi.com.conf
            if [ -f "$OGRAFI_NGINX_CONFIG" ]; then
              sed -i '/valid_referers ografi.com www.ografi.com;/d; /if (\$invalid_referer)/,+3d' "$OGRAFI_NGINX_CONFIG"
              if nginx -t; then
                nginx -s reload || true
              fi
            fi
            php artisan migrate --force || true
            php artisan moderation:ai-bootstrap
            php artisan moderation:ai-scan --limit=3 || true
            php artisan storage:link || true
            php artisan optimize:clear || true

            # www.ografi.com uses a separate static Nginx root. Keep its
            # crawler entry point synchronized with the canonical application.
            NGINX_BIN="$(command -v nginx || true)"
            if [ -z "$NGINX_BIN" ] && [ -x /www/server/nginx/sbin/nginx ]; then
              NGINX_BIN=/www/server/nginx/sbin/nginx
            fi
            if [ -n "$NGINX_BIN" ]; then
              (
              WWW_CONFIG="$($NGINX_BIN -T 2>&1 | awk '
                /^# configuration file / {
                  file=$4
                  sub(/:$/, "", file)
                }
                /server_name[[:space:]].*www\.ografi\.com/ {
                  print file
                  exit
                }
              ')"
              if [ -n "$WWW_CONFIG" ] && [ -f "$WWW_CONFIG" ]; then
                WWW_ROOT="$(awk '
                  /^[[:space:]]*root[[:space:]]+/ {
                    root=$2
                    sub(/;$/, "", root)
                    print root
                  exit
                }
              ' "$WWW_CONFIG")"
              fi
              if [ -z "${WWW_ROOT:-}" ] && [ -d /www/server/nginx/html ]; then
                WWW_ROOT=/www/server/nginx/html
              fi
              if [ -z "${WWW_ROOT:-}" ] || [ ! -d "$WWW_ROOT" ]; then
                echo "Unable to locate the www.ografi.com document root" >&2
                exit 1
              fi
              ROBOTS_SOURCE="$(readlink -f public/robots.txt)"
              ROBOTS_TARGET="$(readlink -f "$WWW_ROOT/robots.txt")"
              if [ "$ROBOTS_SOURCE" != "$ROBOTS_TARGET" ]; then
                install -m 0644 public/robots.txt "$WWW_ROOT/robots.txt"
                echo "Published robots.txt to $WWW_ROOT"
              else
                echo "robots.txt already uses the application public file"
              fi

              WWW_CONFIGS="$($NGINX_BIN -T 2>&1 | awk '
                  /^# configuration file / {
                    file=$4
                    sub(/:$/, "", file)
                  }
                  /^[[:space:]]*root[[:space:]]+\/www\/server\/nginx\/html;/ {
                    print file
                  }
                ' | sort -u)"
              if [ -n "$WWW_CONFIG" ]; then
                WWW_CONFIGS="$(printf '%s\n%s\n' "$WWW_CONFIGS" "$WWW_CONFIG" | sed '/^$/d' | sort -u)"
              fi
              if [ -z "$WWW_CONFIGS" ]; then
                echo "Unable to locate the Nginx configuration serving www.ografi.com" >&2
                exit 1
              fi
              for CONFIG_FILE in $WWW_CONFIGS; do
                if [ ! -f "$CONFIG_FILE" ]; then
                  continue
                fi
                if ! grep -q 'ografi-managed-robots' "$CONFIG_FILE"; then
                  sed -i '$i\    # ografi-managed-robots\
                location = /robots.txt {\
                    alias /www/server/nginx/html/robots.txt;\
                    default_type text/plain;\
                }' "$CONFIG_FILE"
                fi
                echo "Configured robots.txt in $CONFIG_FILE"
              done
              "$NGINX_BIN" -t
              "$NGINX_BIN" -s reload
              ) || echo "Optional www.ografi.com robots.txt synchronization skipped" >&2
            fi

            chown -R www:www "$TARGET_PATH"
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            /etc/init.d/php-fpm-84 restart || true
