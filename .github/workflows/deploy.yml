name: Deploy OgraFi

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ografi-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to ografi.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP for syntax checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP source syntax
        run: |
          set -euo pipefail
          find app bootstrap config database routes -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install PHP dependencies and run automated tests
        env:
          APP_ENV: testing
          APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
        run: |
          set -euo pipefail
          composer update minishlink/web-push laravel/reverb --with-all-dependencies --no-interaction --prefer-dist
          if ! git diff --quiet -- composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "Update Composer lock for web push and Reverb"
            git push origin HEAD:main
          fi
          php artisan test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate theme JavaScript syntax
        run: |
          set -euo pipefail
          node --check public/assets/js/app.js
          node --check public/assets/js/init.js

      - name: Build frontend assets
        run: |
          npm install
          npm run build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload built assets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          test -d public/build
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/public/build'"
          scp -P "$PORT" -r public/build/. "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/public/build/"

      - name: Deploy Laravel application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && git pull --ff-only origin main && composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader && php artisan migrate --force && php artisan optimize:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache"

      - name: Ensure Laravel scheduler runs every minute
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          PHP_BIN="/www/server/php/84/bin/php"
          REMOTE_CRON="$(printf '%s' "* * * * * cd '$DEPLOY_PATH' && '$PHP_BIN' artisan schedule:run >> /dev/null 2>&1" | base64 -w0)"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "test -x '$PHP_BIN' && (crontab -l 2>/dev/null | grep -Fv 'php artisan schedule:run' | grep -Fv '$PHP_BIN artisan schedule:run' || true; printf '%s' '$REMOTE_CRON' | base64 -d) | crontab -"
