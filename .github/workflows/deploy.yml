name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: 2.24.139.184
          username: root
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            TARGET_PATH="${{ secrets.SERVER_PATH }}"
            if [ -z "$TARGET_PATH" ]; then
              TARGET_PATH="/www/wwwroot/ografi_com_app"
            fi
            cd "$TARGET_PATH"
            git stash --include-untracked || true
            git pull origin main
            composer install --no-interaction --prefer-dist --optimize-autoloader
            npm run build
            php artisan migrate --force || true
            php artisan storage:link || true
            php artisan optimize:clear || true

            # www.ografi.com uses a separate static Nginx root. Keep its
            # crawler entry point synchronized with the canonical application.
            NGINX_BIN="$(command -v nginx || true)"
            if [ -z "$NGINX_BIN" ] && [ -x /www/server/nginx/sbin/nginx ]; then
              NGINX_BIN=/www/server/nginx/sbin/nginx
            fi
            if [ -n "$NGINX_BIN" ]; then
              WWW_CONFIG="$($NGINX_BIN -T 2>&1 | awk '
                /^# configuration file / {
                  file=$4
                  sub(/:$/, "", file)
                }
                /server_name[[:space:]].*www\.ografi\.com/ {
                  print file
                  exit
                }
              ')"
              if [ -n "$WWW_CONFIG" ] && [ -f "$WWW_CONFIG" ]; then
                WWW_ROOT="$(awk '
                  /^[[:space:]]*root[[:space:]]+/ {
                    root=$2
                    sub(/;$/, "", root)
                    print root
                  exit
                }
              ' "$WWW_CONFIG")"
              fi
              if [ -z "${WWW_ROOT:-}" ] && [ -d /www/server/nginx/html ]; then
                WWW_ROOT=/www/server/nginx/html
              fi
              if [ -z "${WWW_ROOT:-}" ] || [ ! -d "$WWW_ROOT" ]; then
                echo "Unable to locate the www.ografi.com document root" >&2
                exit 1
              fi
              install -m 0644 public/robots.txt "$WWW_ROOT/robots.txt"
              echo "Published robots.txt to $WWW_ROOT"
            fi

            chown -R www:www "$TARGET_PATH"
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            /etc/init.d/php-fpm-84 restart || true
