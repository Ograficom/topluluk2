name: Deploy OgraFi

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ografi-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to ografi.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP for syntax checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP source syntax
        run: |
          set -euo pipefail
          find app bootstrap config database routes -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install PHP dependencies and run automated tests
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          php artisan test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate theme JavaScript syntax
        run: |
          set -euo pipefail
          node --check public/assets/js/app.js
          node --check public/assets/js/init.js

      - name: Build frontend assets
        run: |
          npm install
          npm run build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload built assets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          test -d public/build
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/public/build'"
          scp -P "$PORT" -r public/build/. "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/public/build/"

      - name: Deploy Laravel application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && git pull --ff-only origin main && composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader && php artisan migrate --force && php artisan optimize:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache"

      - name: Ensure Laravel scheduler runs every minute
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          REMOTE_CRON="* * * * * cd '$DEPLOY_PATH' && php artisan schedule:run >> /dev/null 2>&1"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "(crontab -l 2>/dev/null | grep -Fv 'php artisan schedule:run' || true; printf '%s\\n' '$REMOTE_CRON') | crontab -"
