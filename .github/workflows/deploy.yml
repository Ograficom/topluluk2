name: Deploy OgraFi Coming Soon Page

on:
  push:
    branches:
      - main

concurrency:
  group: ografi-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static landing page
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: 2.24.139.184
          username: root
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: 22
          timeout: 120s
          command_timeout: 10m
          script: |
            set -e
            TARGET_PATH="${{ secrets.SERVER_PATH }}"
            if [ -z "$TARGET_PATH" ]; then
              TARGET_PATH="/www/wwwroot/ografi.com"
            fi
            cd "$TARGET_PATH"
            git fetch origin main
            git reset --hard origin/main
            test -s public/index.html
            chown -R www:www public
            echo "OgraFi coming-soon page published."
            LIVE_STATUS="$(curl -kLsS --max-time 30 -o /tmp/ografi-coming-soon.html -w '%{http_code}' --resolve ografi.com:443:127.0.0.1 https://ografi.com/)"
            test "$LIVE_STATUS" = "200"
            grep -q 'Fikirlerin' /tmp/ografi-coming-soon.html
            echo "Live homepage verified: HTTP $LIVE_STATUS"
