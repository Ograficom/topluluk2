name: Bootstrap Rankbeam SEO

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rankbeam-bootstrap.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Install Rankbeam SEO without booting Laravel
        run: |
          composer require rankbeam/laravel-seo-filament:^1.5 --no-scripts --no-interaction
          cp vendor/rankbeam/laravel-seo/config/seo.php config/seo.php

      - name: Commit package lock and config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rankbeam-bootstrap.yml
          git add composer.json composer.lock config/seo.php
          git commit -m "Install Rankbeam SEO for Filament"
          git push origin HEAD:main
