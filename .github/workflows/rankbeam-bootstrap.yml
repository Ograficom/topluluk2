name: Bootstrap Rankbeam SEO

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rankbeam-bootstrap.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Prepare Laravel runtime paths
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views
          test -f .env || cp .env.example .env

      - name: Install Rankbeam SEO
        run: |
          composer require rankbeam/laravel-seo-filament --with-all-dependencies --no-interaction
          php artisan vendor:publish --tag=seo-config --force

      - name: Commit package lock and config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rankbeam-bootstrap.yml
          git add composer.json composer.lock config/seo.php
          git commit -m "Install Rankbeam SEO for Filament"
          git push origin HEAD:main
