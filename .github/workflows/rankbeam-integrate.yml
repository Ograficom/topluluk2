name: Integrate Rankbeam SEO

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rankbeam-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Apply Rankbeam integration
        run: python .github/scripts/rankbeam_integration.py

      - name: Syntax checks
        run: |
          php -l app/Models/Post.php
          php -l app/Filament/Resources/PostResource.php
          php -l app/Http/Controllers/BlogController.php
          grep -q "rankbeam/laravel-seo-filament" composer.json
          grep -q "HasSEOFields" app/Filament/Resources/PostResource.php
          grep -q "rankbeam_focus_keywords" resources/views/blog/create.blade.php
          grep -q "rankbeam_focus_keywords" resources/views/blog/edit.blade.php
          grep -q "rankbeamPageCanonical" resources/views/blog/show.blade.php

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rankbeam-integrate.yml .github/scripts/rankbeam_integration.py
          git add app/Models/Post.php app/Filament/Resources/PostResource.php app/Http/Controllers/BlogController.php resources/views/blog/create.blade.php resources/views/blog/edit.blade.php resources/views/blog/show.blade.php resources/views/blog/partials/rankbeam-seo-fields.blade.php
          git commit -m "Integrate Rankbeam SEO for Filament and public posts"
          git push origin HEAD:main
