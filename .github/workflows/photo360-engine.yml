name: 360 panorama engine verification

on:
  push:
    paths:
      - 'scripts/photo360_hugin.py'
      - 'scripts/smoke_photo360_hugin.py'
      - 'scripts/test_photo360_hugin.py'
      - '.github/workflows/photo360-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install actual panorama binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y hugin-tools enblend python3-pil python3-numpy
      - name: Check code and rejection tests
        run: |
          /usr/bin/python3 -m py_compile scripts/photo360_hugin.py scripts/smoke_photo360_hugin.py
          /usr/bin/python3 scripts/test_photo360_hugin.py
          node --check public/assets/js/photo360-capture.js
      - name: Execute real Hugin / Nona / Enblend on synthetic camera frames
        run: /usr/bin/python3 scripts/smoke_photo360_hugin.py
