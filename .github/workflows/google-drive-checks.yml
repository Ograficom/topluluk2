name: Google Drive integration checks

on:
  push:
    branches:
      - feature/google-drive-storage

permissions:
  contents: write

concurrency:
  group: google-drive-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  composer-and-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Resolve Google API dependency and update lock file
        run: composer update google/apiclient --with-dependencies --no-interaction --prefer-dist

      - name: Validate Composer manifest and lock file
        run: composer validate --no-check-publish

      - name: Commit generated Composer lock
        run: |
          if ! git diff --quiet -- composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "Lock Google Drive API dependencies"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check PHP syntax
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run Laravel test suite
        run: php artisan test
