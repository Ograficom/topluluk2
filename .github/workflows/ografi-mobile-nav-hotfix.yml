name: Ografi mobile nav hotfix

on:
  push:
    paths:
      - '.github/workflows/ografi-mobile-nav-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile nav
        run: |
          echo '' | base64 -d > /tmp/ografi_patch.py
          python /tmp/ografi_patch.py

      - name: Commit changes
        run: |
          rm -f .github/workflows/ografi-mobile-nav-hotfix.yml
          git config user.name "Ografi Automation"
          git config user.email "actions@users.noreply.github.com"
          git add resources/views/components/mobile-bottom-nav.blade.php .github/workflows/ografi-mobile-nav-hotfix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix iOS 26 mobile login drawer controls"
          git push origin HEAD:main
