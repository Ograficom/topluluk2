name: Figma Live Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/figma-live-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture remaining live Ografi pages into Figma
        run: |
          cat > capture.mjs <<'NODE'
          import { chromium } from 'playwright';

          const captures = [
            ['Live / Discover', 'https://ografi.com/discover', '0f8f8403-c694-41b3-a1d8-cb66d2bbb172'],
            ['Live / Contact', 'https://ografi.com/contact', '3dffede5-9661-4130-9b58-f16f3b56d8bc'],
            ['Live / FAQ', 'https://ografi.com/p/sss', '2cddd9ac-d94b-4647-b902-78da79723c27'],
            ['Live / Popular', 'https://ografi.com/blog/popular', 'd4789003-0624-4140-bd87-f2ce77ebdddc'],
            ['Live / Login', 'https://ografi.com/login', '290db8ac-3950-44a8-af63-0a1ba53e3edf'],
            ['Live / Register', 'https://ografi.com/register', 'cf84b34f-3ccc-47e9-827b-b9faddd05d82'],
            ['Live / Forgot Password', 'https://ografi.com/forgot-password', 'd692ea73-6090-424f-9e9a-ef4aa5896ec4'],
            ['Live / Privacy', 'https://ografi.com/sayfa/gizlilik-politikasi', '642f1f93-0192-4bbe-8274-ddfdac4831d8'],
            ['Live / About', 'https://ografi.com/sayfa/hakkimizda', 'd256abb5-5d7f-40c5-9c3e-274421665f3b'],
            ['Live / Category Haberler', 'https://ografi.com/Categorys/haberler', '0ca61402-3ac3-462d-aac2-a485ab45563b'],
            ['Live / Post Detail', 'https://ografi.com/tr/marmara-depreminde-yollari-kesisen-cift-bugun-afetzedelerin-yardimina-kosuyor', 'b347ee02-1fcf-4951-95b7-1c7da5a72828'],
          ];

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1200 },
            locale: 'tr-TR',
          });

          async function startCapture([name, url, captureId]) {
            const page = await context.newPage();
            await page.route('**/*', async (route) => {
              try {
                const response = await route.fetch();
                const headers = { ...response.headers() };
                delete headers['content-security-policy'];
                delete headers['content-security-policy-report-only'];
                await route.fulfill({ response, headers });
              } catch {
                try { await route.continue(); } catch {}
              }
            });

            try {
              console.log(`Opening ${name}: ${url}`);
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(2500);
              const r = await page.context().request.get('https://mcp.figma.com/mcp/html-to-design/capture.js');
              if (!r.ok()) throw new Error(`capture.js ${r.status()}`);
              const script = await r.text();
              await page.evaluate((s) => {
                const el = document.createElement('script');
                el.textContent = s;
                document.head.appendChild(el);
              }, script);
              await page.waitForTimeout(700);
              await page.evaluate(({ captureId }) => {
                if (!window.figma?.captureForDesign) throw new Error('figma capture API missing');
                window.figma.captureForDesign({
                  captureId,
                  endpoint: `https://mcp.figma.com/mcp/capture/${captureId}/submit?bindVariables=true`,
                  selector: 'body',
                }).catch((e) => console.error('captureForDesign', e));
                return true;
              }, { captureId });
              console.log(`Started ${name}`);
              return page;
            } catch (error) {
              console.error(`FAILED TO START ${name}:`, error);
              await page.close();
              return null;
            }
          }

          const pages = (await Promise.all(captures.map(startCapture))).filter(Boolean);
          console.log(`Started ${pages.length}/${captures.length} captures; keeping browsers alive for uploads.`);
          await new Promise((resolve) => setTimeout(resolve, 120000));
          await Promise.allSettled(pages.map((page) => page.close()));
          await browser.close();
          NODE
          node capture.mjs
