name: Figma Live Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/figma-live-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture remaining desktop public routes
        run: |
          cat > capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          const captures = [
            ['Live / Search', 'https://ografi.com/search', '431a8145-3243-43a0-b3bf-317779a014fc'],
            ['Live / Tags', 'https://ografi.com/blog/tags', 'eef912fd-e5d4-424a-b6ef-f8fe488e3104'],
            ['Live / Users', 'https://ografi.com/users', '37f1a009-9b05-4249-9f66-4d001970c8b5'],
            ['Live / Video', 'https://ografi.com/video', '02a61844-f7b1-44db-8502-c4f394d0d931'],
            ['Live / Communities', 'https://ografi.com/Categorys', '79d902ed-8e57-4395-aab9-4a9a43f323b1'],
            ['Live / Profile Admin', 'https://ografi.com/u/admin', '094c957f-c3aa-4dae-a3a1-d83e2947e559'],
            ['Live / Advertise', 'https://ografi.com/reklam-ver', '0e4225a7-d680-4ebf-8700-f5fbe876e984'],
          ];
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1200 }, locale: 'tr-TR' });
          async function startCapture([name, url, captureId]) {
            const page = await context.newPage();
            await page.route('**/*', async route => {
              try {
                const response = await route.fetch();
                const headers = { ...response.headers() };
                delete headers['content-security-policy'];
                delete headers['content-security-policy-report-only'];
                await route.fulfill({ response, headers });
              } catch { try { await route.continue(); } catch {} }
            });
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(2500);
              const r = await page.context().request.get('https://mcp.figma.com/mcp/html-to-design/capture.js');
              const script = await r.text();
              await page.evaluate(s => { const el=document.createElement('script'); el.textContent=s; document.head.appendChild(el); }, script);
              await page.waitForTimeout(700);
              await page.evaluate(({captureId}) => { window.figma.captureForDesign({captureId, endpoint:`https://mcp.figma.com/mcp/capture/${captureId}/submit?bindVariables=true`, selector:'body'}).catch(console.error); return true; }, {captureId});
              console.log(`Started ${name}: ${url}`);
              return page;
            } catch (e) { console.error(`FAILED ${name}`, e); await page.close(); return null; }
          }
          const pages=(await Promise.all(captures.map(startCapture))).filter(Boolean);
          await new Promise(r=>setTimeout(r,120000));
          await Promise.allSettled(pages.map(p=>p.close()));
          await browser.close();
          NODE
          node capture.mjs
