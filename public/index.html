<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><meta name="description" content="OgraFi çok yakında yayında."><title>OgraFi — Çok Yakında</title><style>:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff}.page{text-align:center;width:min(100%,720px);padding:64px 20px;position:relative}.brand{display:inline-flex;align-items:center;gap:10px;font-size:24px;font-weight:800;letter-spacing:-1px}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#2563eb;color:#fff}.eyebrow{margin:64px 0 18px;color:#2563eb;font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase}h1{margin:0;font-size:clamp(44px,8vw,76px);line-height:1.04;letter-spacing:-4px}h1 span{color:#2563eb}.desc{max-width:500px;margin:24px auto 0;color:#718096;font-size:17px;line-height:1.8}.status{display:inline-flex;align-items:center;gap:10px;margin-top:40px;padding:12px 17px;border:1px solid #e8edf5;border-radius:999px;color:#526176;font-size:13px;font-weight:650}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 5px #22c55e1a}footer{margin-top:76px;color:#9aa5b5;font-size:12px}@media(max-width:520px){h1{letter-spacing:-2px}.desc{font-size:15px}}</style></head><body><main class="page"><div class="brand"><span class="logo">O</span>OgraFi</div><p class="eyebrow">Yeni bir başlangıç</p><h1>Çok yakında<br><span>yayındayız.</span></h1><p class="desc">OgraFi için her şeyi yeniden hazırlıyoruz. Daha iyi fikirlerin, paylaşımların ve toplulukların buluşacağı yeni deneyim çok yakında burada.</p><div class="status"><span class="dot"></span>Hazırlıklarımız devam ediyor</div><footer>© <span id="year"></span> OgraFi. Tüm hakları saklıdır.</footer></main><script>document.getElementById('year').textContent=new Date().getFullYear()</script></body></html>
