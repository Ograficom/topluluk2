<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f9fd">
    <title>Çevrimdışısın — OgraFi</title>
    <style>
        :root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f9fd;color:#172033}
        *{box-sizing:border-box}
        body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
        main{width:min(100%,440px);padding:36px 28px;text-align:center;background:#fff;border:1px solid #e5eaf2;border-radius:24px;box-shadow:0 16px 48px rgba(25,45,80,.08)}
        img{width:64px;height:64px;margin-bottom:18px}
        h1{margin:0 0 12px;font-size:25px;letter-spacing:-.7px}
        p{margin:0;color:#64748b;line-height:1.65}
        button{margin-top:24px;border:0;border-radius:12px;padding:13px 22px;background:#0d6efd;color:#fff;font:600 15px inherit;cursor:pointer}
    </style>
</head>
<body>
    <main>
        <img src="/assets/img/meta/pwa-icon.svg" alt="OgraFi">
        <h1>İnternet bağlantısı yok</h1>
        <p>OgraFi’ye şu anda bağlanamıyoruz. Bağlantını kontrol edip yeniden deneyebilirsin.</p>
        <button type="button" onclick="window.location.reload()">Yeniden dene</button>
    </main>
</body>
</html>
